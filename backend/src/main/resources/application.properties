spring.application.name=falaescrita-backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/streaming_db
spring.datasource.username=admin
spring.datasource.password=adminpassword
spring.jpa.hibernate.ddl-auto=update

# MongoDB
spring.data.mongodb.uri=mongodb://admin:adminpassword@localhost:27017/streaming_mongo?authSource=admin

# CORS
app.cors.allowed-origins=http://localhost:3000

# Transcription (Whisper/OpenAI)
app.transcription.min-batch-bytes=12000
app.transcription.max-batch-millis=2500
app.transcription.openai.base-url=https://api.openai.com
app.transcription.openai.model=whisper-1
app.transcription.openai.language=pt
app.transcription.openai.api-key=${OPENAI_API_KEY:}
